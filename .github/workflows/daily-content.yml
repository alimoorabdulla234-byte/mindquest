name: MindQuest daily challenge

on:
  schedule:
    - cron: "0 4 * * *" # 08:00 UAE time (UTC+4)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindquest-daily-content
  cancel-in-progress: false

jobs:
  update-daily-challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate today's prepared challenge
        run: python scripts/generate_daily.py
      - name: Commit and push if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-content.json
          if git diff --cached --quiet; then
            echo "No daily content change."
          else
            git commit -m "Update daily MindQuest challenge"
            git push
          fi
